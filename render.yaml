services:
  - type: web
    name: elton-garage-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: pnpm install && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false        # Preencher no painel do Render com a URL do Supabase
      - key: SESSION_SECRET
        generateValue: true
