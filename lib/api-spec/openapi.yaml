  # ── BACKUP ────────────────────────────────────────────
  /backup/export:
    get:
      operationId: exportBackup
      tags: [backup]
      summary: Export database backup
      security:
        - bearerAuth: []
      responses:
        "200":
          description: SQLite database file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /backup/restore:
    post:
      operationId: restoreBackup
      tags: [backup]
      summary: Restore database from backup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BackupRestoreInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
    SearchParam:
      name: search
      in: query
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error, message]

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
      required: [total, page, limit, totalPages]

    AppointmentStatus:
      type: string
      enum: [agendado, confirmado, em_andamento, concluido, cancelado]

    # ── AUTH ─────────────────────────────────────────────
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    AuthResult:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required: [token, user]

    AppointmentStatusInput:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/AppointmentStatus"
      required: [status]

    BackupRestoreInput:
      type: object
      properties:
        file:
          type: string
          format: binary

    # ── USER ─────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, technician, receptionist]
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, name, email, role, active, createdAt]

    CreateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum: [admin, technician, receptionist]
      required: [name, email, password, role]

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum: [admin, technician, receptionist]
        active:
          type: boolean

    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required: [data, meta]

    # ── CUSTOMER ──────────────────────────────────────────
    Customer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        whatsapp:
          type: string
        email:
          type: string
        address:
          type: string
        notes:
          type: string
        totalSpent:
          type: number
        totalServices:
          type: integer
        lastServiceDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, totalSpent, totalServices, createdAt, updatedAt]

    CustomerDetail:
      allOf:
        - $ref: "#/components/schemas/Customer"
        - type: object
          properties:
            vehicles:
              type: array
              items:
                $ref: "#/components/schemas/Vehicle"
            loyaltyCard:
              $ref: "#/components/schemas/LoyaltyCard"

    CreateCustomerRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        whatsapp:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
        notes:
          type: string
      required: [name]

    UpdateCustomerRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        whatsapp:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
        notes:
          type: string

    CustomerListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required: [data, meta]

    # ── VEHICLE ───────────────────────────────────────────
    Vehicle:
      type: object
      properties:
        id:
          type: integer
        customerId:
          type: integer
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
        plate:
          type: string
        color:
          type: string
        fuel:
          type: string
          enum: [gasolina, etanol, flex, diesel, gnv, eletrico, hibrido]
        mileage:
          type: integer
        notes:
          type: string
        customerName:
          type: string
      required: [id, customerId, brand, model]

    CreateVehicleRequest:
      type: object
      properties:
        customerId:
          type: integer
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
        plate:
          type: string
        color:
          type: string
        fuel:
          type: string
          enum: [gasolina, etanol, flex, diesel, gnv, eletrico, hibrido]
        mileage:
          type: integer
        notes:
          type: string
      required: [customerId, brand, model]

    UpdateVehicleRequest:
      type: object
      properties:
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
        plate:
          type: string
        color:
          type: string
        fuel:
          type: string
          enum: [gasolina, etanol, flex, diesel, gnv, eletrico, hibrido]
        mileage:
          type: integer
        notes:
          type: string

    VehicleListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Vehicle"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required: [data, meta]

    # ── SERVICE ───────────────────────────────────────────
    Service:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          type: number
        estimatedDuration:
          type: integer
          description: Duration in minutes
        category:
          type: string
        vehicleType:
          type: string
          enum: [todos, hatch, sedan, suv, pickup, van, moto, caminhao]
        active:
          type: boolean
      required: [id, name, price, active]

    CreateServiceRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        estimatedDuration:
          type: integer
        category:
          type: string
        vehicleType:
          type: string
          enum: [todos, hatch, sedan, suv, pickup, van, moto, caminhao]
        active:
          type: boolean
      required: [name, price]

    UpdateServiceRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        estimatedDuration:
          type: integer
        category:
          type: string
        vehicleType:
          type: string
          enum: [todos, hatch, sedan, suv, pickup, van, moto, caminhao]
        active:
          type: boolean

    ServiceListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required: [data, meta]

    # ── APPOINTMENT ───────────────────────────────────────
    Appointment:
      type: object
      properties:
        id:
          type: integer
        customerId:
          type: integer
        vehicleId:
          type: integer
        serviceIds:
          type: array
          items:
            type: integer
        appointmentDate:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        discount:
          type: number
        finalPrice:
          type: number
        totalDuration:
          type: integer
          description: Total estimated duration in minutes (sum of all services)
        observations:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, customerId, vehicleId, serviceIds, appointmentDate, status, createdAt]

    AppointmentDetail:
      allOf:
        - $ref: "#/components/schemas/Appointment"
        - type: object
          properties:
            customer:
              $ref: "#/components/schemas/Customer"
            vehicle:
              $ref: "#/components/schemas/Vehicle"
            services:
              type: array
              items:
                $ref: "#/components/schemas/Service"
            orderService:
              $ref: "#/components/schemas/OrderService"

    CreateAppointmentRequest:
      type: object
      properties:
        customerId:
          type: integer
        vehicleId:
          type: integer
        serviceIds:
          type: array
          items:
            type: integer
          minItems: 1
        appointmentDate:
          type: string
          format: date-time
        discount:
          type: number
        observations:
          type: string
      required: [customerId, vehicleId, serviceIds, appointmentDate]

    UpdateAppointmentRequest:
      type: object
      properties:
        customerId:
          type: integer
        vehicleId:
          type: integer
        serviceIds:
          type: array
          items:
            type: integer
          minItems: 1
        appointmentDate:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        discount:
          type: number
        finalPrice:
          type: number
        observations:
          type: string

    AppointmentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AppointmentDetail"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required: [data, meta]

    # ── ORDER SERVICE ─────────────────────────────────────
    OrderService:
      type: object
      properties:
        id:
          type: integer
        appointmentId:
          type: integer
        beforePhotos:
          type: array
          items:
            type: string
        afterPhotos:
          type: array
          items:
            type: string
        checklist:
          type: object
          additionalProperties: true
        observations:
          type: string
        paymentMethod:
          type: string
          enum: [dinheiro, cartao_credito, cartao_debito, pix, transferencia]
        technician:
          type: string
        signature:
          type: string
      required: [id, appointmentId]

    CreateOrderServiceRequest:
      type: object
      properties:
        beforePhotos:
          type: array
          items:
            type: string
        afterPhotos:
          type: array
          items:
            type: string
        checklist:
          type: object
          additionalProperties: true
        observations:
          type: string
        paymentMethod:
          type: string
          enum: [dinheiro, cartao_credito, cartao_debito, pix, transferencia]
        technician:
          type: string
        signature:
          type: string

    UpdateOrderServiceRequest:
      type: object
      properties:
        beforePhotos:
          type: array
          items:
            type: string
        afterPhotos:
          type: array
          items:
            type: string
        checklist:
          type: object
          additionalProperties: true
        observations:
          type: string
        paymentMethod:
          type: string
          enum: [dinheiro, cartao_credito, cartao_debito, pix, transferencia]
        technician:
          type: string
        signature:
          type: string

    # ── PRODUCT ───────────────────────────────────────────
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        brand:
          type: string
        supplier:
          type: string
        purchasePrice:
          type: number
        salePrice:
          type: number
        stock:
          type: number
        minimumStock:
          type: number
        unit:
          type: string
        isLowStock:
          type: boolean
      required: [id, name, stock, minimumStock]

    CreateProductRequest:
      type: object
      properties:
        name:
          type: string
        brand:
          type: string
        supplier:
          type: string
        purchasePrice:
          type: number
        salePrice:
          type: number
        stock:
          type: number
        minimumStock:
          type: number
        unit:
          type: string
      required: [name, stock, minimumStock]

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
        brand:
          type: string
        supplier:
          type: string
        purchasePrice:
          type: number
        salePrice:
          type: number
        stock:
          type: number
        minimumStock:
          type: number
        unit:
          type: string

    ProductListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required: [data, meta]

    # ── PRODUCT USAGE ─────────────────────────────────────
    ProductUsage:
      type: object
      properties:
        id:
          type: integer
        appointmentId:
          type: integer
        productId:
          type: integer
        quantity:
          type: number
        product:
          $ref: "#/components/schemas/Product"
      required: [id, appointmentId, productId, quantity]

    CreateProductUsageRequest:
      type: object
      properties:
        productId:
          type: integer
        quantity:
          type: number
      required: [productId, quantity]

    # ── INVENTORY ─────────────────────────────────────────
    InventoryMovement:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: integer
        movementType:
          type: string
          enum: [entrada, saida, ajuste]
        quantity:
          type: number
        reason:
