            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardKpis"

  /dashboard/revenue-by-day:
    get:
      operationId: getRevenueByDay
      tags: [dashboard]
